# Deploys web/ to GoDaddy and InfinityFree (two separate FTP targets).
#
# Required secrets (GitHub → Settings → Secrets and variables → Actions):
#
#   GoDaddy (existing):
#     FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#     (optional) FTP_SERVER_DIR — default below is /
#
#   InfinityFree (add these for infinityfree.me):
#     INFINITYFREE_FTP_SERVER   — usually ftpupload.net
#     INFINITYFREE_FTP_USERNAME — e.g. epiz_12345678 (from InfinityFree panel)
#     INFINITYFREE_FTP_PASSWORD — your InfinityFree account password
#
# Each deploy uses its own state file so they don't conflict.

name: Deploy (GoDaddy + InfinityFree)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to GoDaddy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/' }}
          local-dir: ./web/
          state-name: .ftp-deploy-godaddy.json

      - name: Deploy to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.INFINITYFREE_FTP_SERVER }}
          username: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          password: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          server-dir: /htdocs/
          local-dir: ./web/
          state-name: .ftp-deploy-infinityfree.json
          log-level: verbose
          timeout: 120000
